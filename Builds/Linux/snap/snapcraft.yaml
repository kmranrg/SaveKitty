name: savekitty
title: SaveKitty
base: core22
version: '1.0.1'
icon: gui/savekitty.png
summary: A 2D platformer about saving a kitty
description: |
  SaveKitty is a 2D platformer game built with Unity.
  
  Navigate through atmospheric levels, dodge obstacles, and save the kitty!
  
  Controls:
  * Left/Right Arrow: Move
  * Space Bar: Jump

license: BSD-3-Clause
source-code: https://github.com/kmranrg/SaveKitty
website: https://github.com/kmranrg/SaveKitty
issues: https://github.com/kmranrg/SaveKitty/issues
contact: https://github.com/kmranrg

grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  savekitty:
    command: SaveKitty.x86_64
    extensions: [gnome]
    desktop: gui/savekitty.desktop
    plugs:
      - opengl
      - audio-playback
      - home
      - joystick
      - network

parts:
  game:
    plugin: dump
    source: x86_64
    
    override-build: |
      craftctl default
      chmod +x $CRAFT_PART_INSTALL/SaveKitty.x86_64
      chmod +x $CRAFT_PART_INSTALL/UnityPlayer.so
      chmod +x $CRAFT_PART_INSTALL/UnityPlayer_s.debug

    stage-packages:
      - libasound2
      - libasound2-plugins
  
  support-files:
    plugin: dump
    source: gui
    organize:
      'savekitty.desktop': gui/savekitty.desktop
